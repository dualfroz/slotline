spring:
  datasource:
    url: ${SLOTLINE_DB_URL:jdbc:postgresql://localhost:5432/slotline}
    username: ${SLOTLINE_DB_USERNAME:slotline}
    password: ${SLOTLINE_DB_PASSWORD:slotline}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
