spring:
  application:
    name: slotline
  datasource:
    url: jdbc:h2:mem:slotline;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

slotline:
  jwt:
    secret: ${SLOTLINE_JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghij}
    expiration: PT12H
    issuer: slotline
  admin:
    username: ${SLOTLINE_ADMIN_USERNAME:admin}
    password: ${SLOTLINE_ADMIN_PASSWORD:admin12345}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    org.flywaydb.core: info
